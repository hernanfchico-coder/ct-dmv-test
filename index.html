<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecticut DMV Practice Permit Test</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .question-image-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .question-image-container svg {
            width: 130px;
            height: 130px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 8px;
            background-color: #ffffff;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 12px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            background: var(--card-bg);
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f1f5f9;
        }

        .option-btn.correct {
            background-color: #f0fdf4;
            border-color: var(--success);
            color: var(--success);
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #fef2f2;
            border-color: var(--error);
            color: var(--error);
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .feedback.correct {
            display: block;
            background-color: #f0fdf4;
            color: var(--success);
        }

        .feedback.incorrect {
            display: block;
            background-color: #fef2f2;
            color: var(--error);
        }

        .nav-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .primary-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .primary-btn:hover {
            background-color: var(--primary-hover);
        }

        .results-title {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
        }

        .summary-text {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CT DMV Permit Practice</h1>
        <p class="subtitle">Interactive Training Simulator</p>
    </header>

    <div id="quiz-window" class="card">

        <div id="feedback-box" class="feedback"></div>
        <div class="nav-actions">
            <button id="next-btn" class="primary-btn hidden">Next Question &rarr;</button>
        </div>
    </div>

    <div id="results-window" class="card hidden">
        <div class="results-title">Knowledge Evaluation Complete</div>
        <div id="score-output" class="score-display">0%</div>
        <div id="summary-output" class="summary-text"></div>
        <div style="text-align: center;">
            <button id="restart-btn" class="primary-btn">Restart Practice Exam</button>
        </div>
    </div>
</div>

    let currentSequence = [];
    let currentIndex = 0;
    let correctCount = 0;
    let isAnswered = false;

    function initQuiz() {
        currentSequence = Array.from(masterQuestionPool);
        currentSequence.sort(function() { return 0.5 - Math.random(); });
        currentIndex = 0;
        correctCount = 0;
        document.getElementById('results-window').classList.add('hidden');
        document.getElementById('quiz-window').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        isAnswered = false;
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback-box').className = 'feedback';
        
        const currentQ = currentSequence[currentIndex];
        const progressPercent = (currentIndex / currentSequence.length) * 100;
        
        document.getElementById('progress-fill').style.width = progressPercent + '%';
        document.getElementById('question-tracker').textContent = 'Question ' + (currentIndex + 1) + ' of ' + currentSequence.length;
        document.getElementById('source-test-tag').textContent = currentQ.test;
        
        const imgContainer = document.getElementById('image-container');
        imgContainer.innerHTML = '';
        if (currentQ.svg) {
            imgContainer.innerHTML = currentQ.svg;
        }

        document.getElementById('question-text').textContent = currentQ.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        for (let index = 0; index < currentQ.options.length; index++) {
            const optionText = currentQ.options[index];
            const li = document.createElement('li');
            li.className = 'option-item';
            
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.textContent = optionText;
            button.onclick = function() { evaluateSelection(index, button); };
            
            li.appendChild(button);
            optionsContainer.appendChild(li);
        }
    }

    function evaluateSelection(selectedIndex, clickedButton) {
        if (isAnswered) return;
        isAnswered = true;
        
        const currentQ = currentSequence[currentIndex];
        const optionButtons = document.querySelectorAll('.option-btn');
        const feedbackBox = document.getElementById('feedback-box');
        
        for (let i = 0; i < optionButtons.length; i++) {
            optionButtons[i].disabled = true;
        }

        if (selectedIndex === currentQ.correct) {
            clickedButton.classList.add('correct');
            feedbackBox.textContent = "Correct! Great job.";
            feedbackBox.className = "feedback correct";
            correctCount++;
        } else {
            clickedButton.classList.add('incorrect');
            optionButtons[currentQ.correct].classList.add('correct');
            feedbackBox.textContent = "Incorrect. The correct answer was: " + currentQ.options[currentQ.correct];
            feedbackBox.className = "feedback incorrect";
        }
        
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentSequence.length) {
            renderQuestion();
        } else {
            showFinalScore();
        }
    }

    function showFinalScore() {
        document.getElementById('quiz-window').classList.add('hidden');
        document.getElementById('results-window').classList.remove('hidden');
        
        const scorePercentage = Math.round((correctCount / currentSequence.length) * 100);
        document.getElementById('score-output').textContent = scorePercentage + '%';
        
        const feedbackText = scorePercentage >= 80
            ? "Passing score! You correctly answered " + correctCount + " out of " + currentSequence.length + " questions. You are ready for the DMV exam!"
            : "Review required. You scored " + correctCount + " out of " + currentSequence.length + ". Aim for at least 80% to ensure a pass on test day.";
            
        document.getElementById('summary-output').textContent = feedbackText;
    }

    document.getElementById('next-btn').onclick = nextQuestion;
    document.getElementById('restart-btn').onclick = initQuiz;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initQuiz);
    } else {
        initQuiz();
    }
</script>

</body>
</html>
